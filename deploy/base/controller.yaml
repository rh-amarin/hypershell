apiVersion: v1
kind: ServiceAccount
metadata:
  name: hypershell-controller
  namespace: hypershell-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypershell-controller
  namespace: hypershell-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hypershell-controller
  template:
    metadata:
      labels:
        app: hypershell-controller
    spec:
      serviceAccountName: hypershell-controller
      securityContext:
        runAsNonRoot: true
      containers:
        - name: controller
          image: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-control-plane-main:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: HYPERSHELL_GRPC_SERVER_ADDR
              value: "hypershell-api-server:9000"
            - name: HYPERSHELL_API_SERVER_URL
              value: "http://hypershell-api-server:8000"
            - name: HYPERSHELL_NAMESPACE
              value: "hypershell-system"
            - name: HYPERSHELL_LOG_LEVEL
              value: "info"
            # Plaintext in-cluster gRPC provisioner endpoint. A NetworkPolicy
            # restricts port 9443 to the api-server pod; the channel mirrors the
            # sibling control-plane -> api-server watch channel (no mTLS).
            - name: HYPERSHELL_SERVICE_ACCOUNT_PROVISIONER_BIND_ADDRESS
              value: "0.0.0.0:9443"
            - name: GATEWAY_IMAGE
              value: quay.io/opendatahub/odh-openshell-gateway:v0.0.113-rhaiv.2@sha256:6affd5e8f69e55dc43fe19491fc41ac164c4b759962f68a4635faa6956948fdc
            - name: GATEWAY_SUPERVISOR_IMAGE
              value: quay.io/opendatahub/odh-openshell-supervisor:v0.0.113-rhaiv.2@sha256:f72a122ccdf7af385467d326a336126391ca39bf75b35f1ee8d9e7965ebebda2
          ports:
            - containerPort: 9443
              name: provisioner
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hypershell-controller
  namespace: hypershell-system
spec:
  selector:
    app: hypershell-controller
  ports:
    - name: provisioner
      port: 9443
      targetPort: 9443
      appProtocol: grpc
